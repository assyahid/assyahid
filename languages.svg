.s{font:400 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#6f97a8}
.f{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<clipPath id="card"><rect width="500" height="260" rx="16"/></clipPath>
