# Simpan sebagai .github/workflows/profile-automation.yml di repo assyahid/assyahid
# Menjalankan: (1) snake + kartu statistik, (2) update otomatis daftar blog dev.to
name: Profile Automation

on:
  schedule:
    - cron: "0 */12 * * *"   # setiap 12 jam
  workflow_dispatch:          # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate profile cards (stats, languages, activity)
        run: python3 .github/scripts/profile_cards.py ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#36bcf7&color_dots=#161b22,#0f2027,#203a43,#2c5364,#36bcf7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  blog-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/assyahid"
          max_post_count: 5
